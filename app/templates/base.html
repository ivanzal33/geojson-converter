<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Excel → GeoJSON{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{
      --bg:#f6f7f9;--card:#ffffff;--text:#0f172a;--muted:#64748b;--accent:#2563eb;--accent-2:#0ea5e9;
      --ok:#16a34a;--err:#dc2626;--border:#e5e7eb;--shadow:0 10px 30px rgba(2,6,23,.08)
    }
    @media (prefers-color-scheme: dark){
      :root{--bg:#0b1220;--card:#0f172a;--text:#e5e7eb;--muted:#94a3b8;--accent:#60a5fa;--accent-2:#22d3ee;--border:#162033;--shadow:0 10px 30px rgba(0,0,0,.35)}
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:100%;max-width:720px;background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:24px}
    .title{margin:0 0 8px;font-size:22px;font-weight:700;letter-spacing:.2px}
    .subtitle{margin:0 0 16px;color:var(--muted);font-size:14px}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
    .btn.secondary{background:transparent;border:1px solid var(--border);color:var(--text)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .drop{border:2px dashed var(--border);border-radius:14px;padding:18px;text-align:center;transition:.2s background, .2s border-color}
    .drop.drag{background:rgba(37,99,235,.06);border-color:var(--accent)}
    .file-chip{display:inline-flex;align-items:center;gap:8px;background:#eef2ff;color:#1e3a8a;border-radius:999px;padding:6px 10px;font-size:13px}
    @media (prefers-color-scheme: dark){.file-chip{background:#172554;color:#bfdbfe}}
    .footer{margin-top:18px;color:var(--muted);font-size:12px}
    .status{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 12px;font-weight:600;font-size:14px}
    .ok{background:rgba(22,163,74,.12);color:#16a34a}
    .err{background:rgba(220,38,38,.12);color:#ef4444}
    .list{margin:12px 0 0;padding-left:18px}
    details{border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:12px}
    code{background:rgba(148,163,184,.15);padding:2px 6px;border-radius:6px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="wrap">
    <main class="card">
      {% block content %}{% endblock %}
      <div class="footer">Проверка сервиса: <a href="/health">/health</a></div>
    </main>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
